<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modular Application Framework</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            height: 100vh;
            overflow: hidden;
            background: #1e1e1e;
            color: #e0e0e0;
        }

        .app-container {
            display: grid;
            grid-template-columns: 400px 40px 1fr;
            grid-template-rows: 40px 1fr;
            height: 100vh;
            gap: 0;
            background: #2d2d30;
        }

        /* Header */
        .header {
            grid-column: 1 / -1;
            background: #252526;
            display: flex;
            align-items: center;
            padding: 0 15px;
            border-bottom: 1px solid #3e3e42;
            z-index: 100;
        }

        .header h1 {
            font-size: 14px;
            font-weight: 400;
            margin-right: auto;
        }

        .header button {
            background: #0e639c;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            margin-left: 10px;
            transition: background 0.2s;
        }

        .header button:hover {
            background: #1177bb;
        }

        /* GitHub Hub - Fixed left panel */
        .github-hub-panel {
            grid-column: 1;
            grid-row: 2;
            background: #252526;
            border-right: 1px solid #3e3e42;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .panel-header {
            background: #2d2d30;
            padding: 8px 12px;
            border-bottom: 1px solid #3e3e42;
            font-size: 12px;
            font-weight: 500;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .side-tabs {
            display: flex;
            gap: 5px;
            width: 100%;
        }

        .side-tab {
            flex: 1;
            background: transparent;
            border: none;
            color: #e0e0e0;
            padding: 8px 4px;
            cursor: pointer;
            font-size: 11px;
            border-bottom: 2px solid transparent;
            transition: all 0.2s;
        }

        .side-tab:hover {
            background: #3e3e42;
        }

        .side-tab.active {
            border-bottom-color: #0e639c;
            color: #fff;
        }

        .side-panel-content {
            position: relative;
            flex: 1;
            overflow: hidden;
        }

        .side-panel-frame {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
            display: none;
        }

        .side-panel-frame.active {
            display: block;
        }

        .github-hub-panel iframe {
            flex: 1;
            border: none;
            width: 100%;
        }

        /* Modules Panel - Collapsible */
        .modules-panel {
            grid-column: 2;
            grid-row: 2;
            background: #252526;
            border-right: 1px solid #3e3e42;
            position: relative;
            transition: all 0.3s ease;
            width: 40px;
            overflow: hidden;
        }

        .modules-panel.expanded {
            width: 250px;
        }

        .modules-toggle {
            position: absolute;
            top: 10px;
            right: 5px;
            background: #0e639c;
            border: none;
            color: white;
            width: 30px;
            height: 30px;
            border-radius: 4px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            z-index: 10;
            transition: background 0.2s;
        }

        .modules-toggle:hover {
            background: #1177bb;
        }

        .modules-content {
            opacity: 0;
            transition: opacity 0.3s ease;
            padding: 50px 10px 10px;
            overflow-y: auto;
            height: 100%;
        }

        .modules-panel.expanded .modules-content {
            opacity: 1;
        }

        .modules-panel:hover {
            width: 250px;
        }

        .modules-panel:hover .modules-content {
            opacity: 1;
        }

        .module-item {
            padding: 10px;
            margin-bottom: 5px;
            background: #2d2d30;
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.2s;
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 12px;
        }

        .module-item:hover {
            background: #3e3e42;
        }

        .module-item.active {
            background: #0e639c;
        }

        .module-actions {
            display: flex;
            gap: 5px;
        }

        .module-actions button {
            background: #3e3e42;
            border: none;
            color: #e0e0e0;
            padding: 3px 6px;
            border-radius: 3px;
            cursor: pointer;
            font-size: 11px;
        }

        .module-actions button:hover {
            background: #4e4e52;
        }

        .module-status {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #4ec9b0;
            margin-right: 8px;
        }

        .module-status.offline {
            background: #f48771;
        }

        /* Main Tabbed Area */
        .main-area {
            grid-column: 3;
            grid-row: 2;
            display: flex;
            flex-direction: column;
            background: #1e1e1e;
            overflow: hidden;
        }

        .tabs-container {
            background: #2d2d30;
            border-bottom: 1px solid #3e3e42;
            display: flex;
            align-items: center;
            overflow-x: auto;
            overflow-y: hidden;
            min-height: 40px;
            scrollbar-width: thin;
            scrollbar-color: #3e3e42 #2d2d30;
        }

        .tabs-container::-webkit-scrollbar {
            height: 6px;
        }

        .tabs-container::-webkit-scrollbar-track {
            background: #2d2d30;
        }

        .tabs-container::-webkit-scrollbar-thumb {
            background: #3e3e42;
            border-radius: 3px;
        }

        .tab {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 15px;
            background: #252526;
            border-right: 1px solid #3e3e42;
            cursor: pointer;
            font-size: 12px;
            white-space: nowrap;
            transition: background 0.2s;
            min-width: 120px;
            max-width: 200px;
        }

        .tab:hover {
            background: #2d2d30;
        }

        .tab.active {
            background: #1e1e1e;
            border-bottom: 2px solid #0e639c;
        }

        .tab-label {
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .tab-close {
            background: transparent;
            border: none;
            color: #e0e0e0;
            cursor: pointer;
            font-size: 16px;
            padding: 0;
            width: 20px;
            height: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 3px;
            opacity: 0.6;
            transition: all 0.2s;
        }

        .tab-close:hover {
            background: #3e3e42;
            opacity: 1;
        }

        .add-tab-btn {
            background: #0e639c;
            border: none;
            color: white;
            padding: 8px 15px;
            margin: 5px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            white-space: nowrap;
            transition: background 0.2s;
        }

        .add-tab-btn:hover {
            background: #1177bb;
        }

        .tab-content-area {
            flex: 1;
            position: relative;
            overflow: hidden;
        }

        .tab-pane {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: none;
        }

        .tab-pane.active {
            display: block;
        }

        .tab-pane iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.7);
        }

        .modal-content {
            background-color: #2d2d30;
            margin: 15% auto;
            padding: 20px;
            border: 1px solid #3e3e42;
            width: 400px;
            border-radius: 8px;
        }

        .close {
            color: #aaa;
            float: right;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
        }

        .close:hover {
            color: #fff;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-size: 12px;
        }

        .form-group input, .form-group select {
            width: 100%;
            padding: 8px;
            background: #1e1e1e;
            border: 1px solid #3e3e42;
            color: #e0e0e0;
            border-radius: 4px;
        }

        .form-actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 20px;
        }

        .btn {
            padding: 8px 16px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
        }

        .btn-primary {
            background: #0e639c;
            color: white;
        }

        .btn-primary:hover {
            background: #1177bb;
        }

        .btn-secondary {
            background: #3e3e42;
            color: #e0e0e0;
        }

        .btn-secondary:hover {
            background: #4e4e52;
        }

        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: #808080;
            gap: 20px;
        }

        .empty-state-icon {
            font-size: 64px;
            opacity: 0.5;
        }

        .empty-state-text {
            font-size: 14px;
        }

        .empty-state button {
            background: #0e639c;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
        }

        .empty-state button:hover {
            background: #1177bb;
        }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- Header -->
        <div class="header">
            <h1>🚀 Modular Application Framework</h1>
            <button onclick="discoverModules()">🔍 Discover</button>
            <button onclick="exportModules()">⬇️ Export</button>
            <input type="file" id="importFile" style="display:none" accept="application/json" onchange="importModules(this.files[0])"/>
            <button onclick="document.getElementById('importFile').click()">⬆️ Import</button>
            <button onclick="showRegistrationModal()">+ Register Module</button>
            <button onclick="refreshModules()">🔄 Refresh</button>
        </div>

        <!-- GitHub Hub Panel (Fixed Left) -->
        <div class="github-hub-panel">
            <div class="panel-header">
                <div class="side-tabs">
                    <button class="side-tab active" onclick="switchSidePanel('github')">📁 GitHub</button>
                    <button class="side-tab" onclick="switchSidePanel('workspace')">💼 Workspace</button>
                </div>
            </div>
            <div class="side-panel-content">
                <iframe id="githubHubFrame" class="side-panel-frame active" src="/api/v1/github/ui/?embed=side"></iframe>
                <iframe id="workspaceFrame" class="side-panel-frame" src="/api/v1/code-workspace/tree.html"></iframe>
            </div>
        </div>

        <!-- Modules Panel (Collapsible) -->
        <div class="modules-panel" id="modulesPanel">
            <button class="modules-toggle" onclick="toggleModulesPanel()">
                <span id="toggleIcon">☰</span>
            </button>
            <div class="modules-content" id="modulesList">
                <!-- Modules will be loaded here -->
            </div>
        </div>

        <!-- Main Tabbed Area -->
        <div class="main-area">
            <div class="tabs-container" id="tabsContainer">
                <button class="add-tab-btn" onclick="showAddTabModal()">+ Add Tab</button>
            </div>
            <div class="tab-content-area" id="tabContentArea">
                <div class="empty-state">
                    <div class="empty-state-icon">📑</div>
                    <div class="empty-state-text">No tabs open. Click "+ Add Tab" to get started.</div>
                    <button onclick="showAddTabModal()">Add Your First Tab</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Registration Modal -->
    <div id="registrationModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeRegistrationModal()">&times;</span>
            <h2 style="margin-bottom: 20px; font-size: 16px;">Register New Module</h2>
            <div class="form-group">
                <label for="moduleName">Module Name</label>
                <input type="text" id="moduleName" placeholder="e.g., SSH Terminal">
            </div>
            <div class="form-group">
                <label for="moduleUrl">Module URL</label>
                <input type="text" id="moduleUrl" placeholder="http://module-host:port">
            </div>
            <div class="form-group">
                <label for="moduleType">Module Type</label>
                <select id="moduleType">
                    <option value="terminal">Terminal</option>
                    <option value="editor">Editor</option>
                    <option value="viewer">Viewer</option>
                    <option value="dashboard">Dashboard</option>
                    <option value="other">Other</option>
                </select>
            </div>
            <div class="form-group">
                <label for="moduleDescription">Description</label>
                <input type="text" id="moduleDescription" placeholder="Brief description">
            </div>
            <div class="form-actions">
                <button class="btn btn-secondary" onclick="closeRegistrationModal()">Cancel</button>
                <button class="btn btn-primary" onclick="registerModule()">Register</button>
            </div>
        </div>
    </div>

    <!-- Add Tab Modal -->
    <div id="addTabModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeAddTabModal()">&times;</span>
            <h2 style="margin-bottom: 20px; font-size: 16px;">Add New Tab</h2>
            <div class="form-group">
                <label for="tabModule">Select Module</label>
                <select id="tabModule">
                    <option value="">Choose a module...</option>
                </select>
            </div>
            <div class="form-group">
                <label for="tabName">Tab Name (optional)</label>
                <input type="text" id="tabName" placeholder="Custom tab name">
            </div>
            <div class="form-actions">
                <button class="btn btn-secondary" onclick="closeAddTabModal()">Cancel</button>
                <button class="btn btn-primary" onclick="addNewTab()">Add Tab</button>
            </div>
        </div>
    </div>

    <script>
        // Module Registry
        const moduleRegistry = new Map();
        const tabs = [];
        let tabCounter = 0;
        let editingModuleName = null;
        let modulesExpanded = false;

        // Known modules for one-click discovery
        const knownModules = [
            { name: 'SSH Terminal', url: '/api/v1/ssh-terminal/', type: 'terminal', configUrl: '/api/v1/ssh-terminal/', description: 'SSH connection to remote systems' },
            { name: 'LLM Workflows', url: '/api/v1/workflows/', type: 'dashboard', configUrl: '/api/v1/workflows/', description: 'Build, validate & execute JSON workflows' },
            { name: 'LLM Chat', url: '/api/v1/chat/', type: 'other', configUrl: '/api/v1/chat/config', description: 'Chat with LLMs (OpenAI/Ollama/Compat)' },
            { name: 'GitHub Hub', url: '/api/v1/github/ui/', type: 'viewer', configUrl: '/api/v1/github/ui/', description: 'Repo browser & GitHub API for all modules' },
            { name: 'LLM Gateway', url: '/api/v1/gateway/', type: 'dashboard', configUrl: '/api/v1/gateway/', description: 'Gateway admin & keys' },
            { name: 'RAG Admin', url: '/api/v1/rag/admin/', type: 'dashboard', configUrl: '/api/v1/rag/admin/', description: 'RAG Admin UI and API' },
            { name: 'LLM Tester', url: '/api/v1/tester/', type: 'dashboard', configUrl: '/api/v1/tester/', description: 'Create and run LLM tests' },
            { name: 'Documentor', url: '/api/v1/documentor/', type: 'viewer', configUrl: '/api/v1/documentor/', description: 'Generate docs using LLMs' },
            { name: 'Code Workspace', url: '/api/v1/code-workspace/', type: 'editor', configUrl: '/api/v1/code-workspace/', description: 'Code editing workspace' }
        ];

        const demoModules = knownModules;

        // Module Event Bus
        class ModuleEventBus {
            constructor() {
                this.listeners = new Map();
                window.addEventListener('message', (event) => {
                    if (event.data?.type === 'MODULE_EVENT') {
                        this.emit(event.data.eventName, event.data.payload);
                    }
                });
            }
            on(eventName, callback) {
                if (!this.listeners.has(eventName)) this.listeners.set(eventName, []);
                this.listeners.get(eventName).push(callback);
            }
            emit(eventName, data) {
                if (this.listeners.has(eventName)) {
                    this.listeners.get(eventName).forEach(cb => cb(data));
                }
            }
            sendToModule(moduleName, eventName, data) {
                const module = moduleRegistry.get(moduleName);
                if (module?.iframe) {
                    module.iframe.contentWindow.postMessage({ type: 'FRAMEWORK_EVENT', eventName, payload: data }, '*');
                }
            }
        }

        const messageBus = new ModuleEventBus();

        function slug(s) { return s.toLowerCase().replace(/[^a-z0-9]+/g, '-'); }

        function toggleModulesPanel() {
            const panel = document.getElementById('modulesPanel');
            modulesExpanded = !modulesExpanded;
            panel.classList.toggle('expanded', modulesExpanded);
            document.getElementById('toggleIcon').textContent = modulesExpanded ? '×' : '☰';
        }

        function loadModules() {
            const modulesList = document.getElementById('modulesList');
            modulesList.innerHTML = '';

            let modules = [];
            try {
                const saved = JSON.parse(localStorage.getItem('modules') || '[]');
                modules = Array.isArray(saved) && saved.length ? saved : demoModules;
            } catch { modules = demoModules; }

            moduleRegistry.clear();
            modules.forEach(m => {
                const mod = { ...m, status: 'unknown' };
                moduleRegistry.set(mod.name, mod);
            });

            moduleRegistry.forEach((module, name) => {
                const el = renderModuleItem(module);
                modulesList.appendChild(el);
                checkModuleStatus(name);
            });

            updateTabModuleSelector();
        }

        function renderModuleItem(module) {
            const el = document.createElement('div');
            el.className = 'module-item';
            const statusClass = module.status === 'offline' ? 'offline' : '';
            el.innerHTML = `
                <div style="display: flex; align-items: center; flex: 1;">
                    <div class="module-status ${statusClass}" id="status-${slug(module.name)}"></div>
                    <span>${module.name}</span>
                </div>
                <div class="module-actions">
                    <button title="Add to tab" onclick="quickAddTab('${module.name}'); event.stopPropagation();">+</button>
                    <button title="Edit" onclick="editModule('${module.name}'); event.stopPropagation();">✏️</button>
                    <button title="Remove" onclick="removeModule('${module.name}'); event.stopPropagation();">🗑️</button>
                </div>
            `;
            return el;
        }

        async function checkModuleStatus(name) {
            const module = moduleRegistry.get(name);
            if (!module) return;
            try {
                const base = module.url.replace(/\/+$/, '');
                const manifestUrl = `${base}/.well-known/module.json`;
                let ok = false;
                try {
                    const r = await fetch(manifestUrl, { method: 'GET' });
                    if (r.ok) {
                        const j = await r.json().catch(() => null);
                        if (j?.name) {
                            module.type = j.type || module.type || 'other';
                            module.description = j.description || module.description || '';
                            module.configUrl = j.configUrl || module.configUrl;
                        }
                        ok = true;
                    }
                } catch { }

                if (!ok) {
                    const r = await fetch(base, { method: 'HEAD' }).catch(() => null);
                    ok = !!(r && (r.ok || r.status === 405 || r.status === 404));
                }

                module.status = ok ? 'online' : 'offline';
            } catch {
                module.status = 'offline';
            } finally {
                const dot = document.getElementById(`status-${slug(name)}`);
                if (dot) dot.classList.toggle('offline', module.status === 'offline');
                persistModules();
            }
        }

        function quickAddTab(moduleName) {
            const module = moduleRegistry.get(moduleName);
            if (!module) return;
            createTab(moduleName, module.name);
        }

        function showAddTabModal() {
            updateTabModuleSelector();
            document.getElementById('addTabModal').style.display = 'block';
            document.getElementById('tabModule').value = '';
            document.getElementById('tabName').value = '';
        }

        function closeAddTabModal() {
            document.getElementById('addTabModal').style.display = 'none';
        }

        function updateTabModuleSelector() {
            const select = document.getElementById('tabModule');
            if (!select) return;
            select.innerHTML = '<option value="">Choose a module...</option>';
            moduleRegistry.forEach((module, name) => {
                const option = document.createElement('option');
                option.value = name;
                option.textContent = `${name} (${module.type})`;
                select.appendChild(option);
            });
        }

        function addNewTab() {
            const moduleName = document.getElementById('tabModule').value;
            const customName = document.getElementById('tabName').value.trim();
            if (!moduleName) {
                alert('Please select a module');
                return;
            }
            const module = moduleRegistry.get(moduleName);
            if (!module) return;
            const tabName = customName || module.name;
            createTab(moduleName, tabName);
            closeAddTabModal();
        }

        function createTab(moduleName, tabName) {
            const module = moduleRegistry.get(moduleName);
            if (!module) return;

            const tabId = `tab-${++tabCounter}`;
            const tab = {
                id: tabId,
                name: tabName,
                moduleName: moduleName,
                url: module.url
            };
            tabs.push(tab);

            renderTabs();
            activateTab(tabId);
        }

        function renderTabs() {
            const container = document.getElementById('tabsContainer');
            const addBtn = container.querySelector('.add-tab-btn');
            
            // Clear existing tabs but keep add button
            const existingTabs = container.querySelectorAll('.tab');
            existingTabs.forEach(tab => tab.remove());

            // Render all tabs
            tabs.forEach(tab => {
                const tabEl = document.createElement('div');
                tabEl.className = 'tab';
                tabEl.dataset.tabId = tab.id;
                tabEl.innerHTML = `
                    <span class="tab-label" title="${tab.name}">${tab.name}</span>
                    <button class="tab-close" onclick="closeTab('${tab.id}'); event.stopPropagation();">×</button>
                `;
                tabEl.onclick = () => activateTab(tab.id);
                container.insertBefore(tabEl, addBtn);
            });

            renderTabContent();
        }

        function renderTabContent() {
            const contentArea = document.getElementById('tabContentArea');
            contentArea.innerHTML = '';

            if (tabs.length === 0) {
                contentArea.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">📑</div>
                        <div class="empty-state-text">No tabs open. Click "+ Add Tab" to get started.</div>
                        <button onclick="showAddTabModal()">Add Your First Tab</button>
                    </div>
                `;
                return;
            }

            tabs.forEach(tab => {
                const pane = document.createElement('div');
                pane.className = 'tab-pane';
                pane.dataset.tabId = tab.id;
                const iframe = document.createElement('iframe');
                iframe.src = tab.url;
                iframe.id = `iframe-${tab.id}`;
                pane.appendChild(iframe);
                contentArea.appendChild(pane);
            });
        }

        function activateTab(tabId) {
            // Update tab styling
            document.querySelectorAll('.tab').forEach(tab => {
                tab.classList.toggle('active', tab.dataset.tabId === tabId);
            });

            // Show corresponding content
            document.querySelectorAll('.tab-pane').forEach(pane => {
                pane.classList.toggle('active', pane.dataset.tabId === tabId);
            });
        }

        function closeTab(tabId) {
            const index = tabs.findIndex(t => t.id === tabId);
            if (index === -1) return;

            const wasActive = document.querySelector(`.tab[data-tab-id="${tabId}"]`)?.classList.contains('active');
            tabs.splice(index, 1);
            renderTabs();

            if (wasActive && tabs.length > 0) {
                const newActiveIndex = Math.min(index, tabs.length - 1);
                activateTab(tabs[newActiveIndex].id);
            }
        }

        // Module Management
        function showRegistrationModal() {
            editingModuleName = null;
            document.getElementById('registrationModal').style.display = 'block';
            document.getElementById('moduleName').value = '';
            document.getElementById('moduleUrl').value = '';
            document.getElementById('moduleType').value = 'other';
            document.getElementById('moduleDescription').value = '';
        }

        function editModule(name) {
            const m = moduleRegistry.get(name);
            if (!m) return;
            editingModuleName = name;
            document.getElementById('registrationModal').style.display = 'block';
            document.getElementById('moduleName').value = m.name;
            document.getElementById('moduleUrl').value = m.url;
            document.getElementById('moduleType').value = m.type || 'other';
            document.getElementById('moduleDescription').value = m.description || '';
        }

        function closeRegistrationModal() {
            document.getElementById('registrationModal').style.display = 'none';
            editingModuleName = null;
        }

        function registerModule() {
            const name = document.getElementById('moduleName').value.trim();
            const url = document.getElementById('moduleUrl').value.trim();
            const type = document.getElementById('moduleType').value;
            const description = document.getElementById('moduleDescription').value.trim();
            if (!name || !url) {
                alert('Please fill in all required fields');
                return;
            }
            const newModule = {
                name, url, type, description,
                configUrl: `${url.replace(/\/+$/, '')}/config`,
                status: 'unknown'
            };
            if (editingModuleName && moduleRegistry.has(editingModuleName)) {
                if (editingModuleName !== name) moduleRegistry.delete(editingModuleName);
                moduleRegistry.set(name, newModule);
            } else {
                moduleRegistry.set(name, newModule);
            }
            persistModules();
            loadModules();
            closeRegistrationModal();
        }

        function removeModule(name) {
            if (!confirm(`Remove module "${name}"?`)) return;
            moduleRegistry.delete(name);
            persistModules();
            loadModules();
        }

        function persistModules() {
            const modules = Array.from(moduleRegistry.values());
            localStorage.setItem('modules', JSON.stringify(modules));
        }

        function exportModules() {
            const data = localStorage.getItem('modules') || '[]';
            const blob = new Blob([data], { type: 'application/json' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = 'modules.json';
            a.click();
            URL.revokeObjectURL(a.href);
        }

        function importModules(file) {
            if (!file) return;
            const reader = new FileReader();
            reader.onload = () => {
                try {
                    const arr = JSON.parse(reader.result);
                    if (!Array.isArray(arr)) throw new Error('Invalid JSON');
                    arr.forEach(m => moduleRegistry.set(m.name, m));
                    persistModules();
                    loadModules();
                    alert('Modules imported.');
                } catch {
                    alert('Invalid modules JSON.');
                }
            };
            reader.readAsText(file);
        }

        async function discoverModules() {
            let added = 0;
            for (const km of knownModules) {
                try {
                    const base = km.url.replace(/\/+$/, '');
                    const r = await fetch(base, { method: 'HEAD' });
                    if (r.ok || r.status === 405 || r.status === 404) {
                        if (!moduleRegistry.has(km.name)) {
                            moduleRegistry.set(km.name, { ...km, status: 'online' });
                            added++;
                        } else {
                            const cur = moduleRegistry.get(km.name);
                            cur.status = 'online';
                        }
                    }
                } catch { }
            }
            persistModules();
            loadModules();
            alert(added ? `Discovered ${added} module(s).` : 'No new modules discovered.');
        }

        function refreshModules() {
            loadModules();
            messageBus.emit('modules-refreshed', { timestamp: Date.now() });
        }

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            loadModules();
        });

        // Close modals on outside click
        window.onclick = function (event) {
            const regModal = document.getElementById('registrationModal');
            const addTabModal = document.getElementById('addTabModal');
            if (event.target === regModal) closeRegistrationModal();
            if (event.target === addTabModal) closeAddTabModal();
        }
        function switchSidePanel(panel) {
            // Update tab buttons
            document.querySelectorAll('.side-tab').forEach(tab => {
                tab.classList.remove('active');
            });
            event.target.classList.add('active');
            
            // Update frames
            document.querySelectorAll('.side-panel-frame').forEach(frame => {
                frame.classList.remove('active');
            });
            
            if (panel === 'github') {
                document.getElementById('githubHubFrame').classList.add('active');
            } else if (panel === 'workspace') {
                document.getElementById('workspaceFrame').classList.add('active');
            }
        }
    </script>
</body>
</html>
