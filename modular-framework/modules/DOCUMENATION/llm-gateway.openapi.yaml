openapi: 3.1.0
info:
  title: LLM Gateway API
  version: "0.1.0"
  description: |
    Central gateway for LLM interactions, model/provider registry, usage tracking, admin, telemetry and tools.

    How to call through NGINX (canonical external URLs):
    - JSON API base: https://<edge-host>:8443/api/v1/gateway/api
      - All REST endpoints documented under the "JSON API" server are reachable here.
      - NGINX rewrites /api/v1/gateway/api/<path> → llm-gateway:/api/<path>.
    - Module base (UI, health, static): https://<edge-host>:8443/api/v1/gateway
      - Admin UI: /api/v1/gateway/admin
      - Health:   /api/v1/gateway/health
      - Live SSE (telemetry): /api/v1/gateway/api/telemetry/live (see JSON API base)

    Notes
    - Most endpoints are unauthenticated today. Logging config endpoints optionally enforce a bearer token via INTERNAL_API_TOKEN (see security).
    - Streaming endpoints use text/event-stream (Server-Sent Events).

servers:
  - url: /api/v1/gateway/api
    description: JSON API via NGINX (recommended)
  - url: /api/v1/gateway
    description: Module base for UI and health-only

tags:
  - name: Health
  - name: Info
  - name: Providers
  - name: Models
  - name: Chat
  - name: Embeddings
  - name: Usage
  - name: Tokens
  - name: Telemetry
  - name: Conversations
  - name: Templates
  - name: Debug
  - name: Logging
  - name: Logs
  - name: UI

paths:
  /health:
    get:
      tags: [Health]
      summary: Health check
      description: Returns module health. Call at /api/v1/gateway/health (module base server).
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: healthy }

  /info:
    get:
      tags: [Info]
      summary: Module info
      responses:
        "200":
          description: Info payload
          content:
            application/json:
              schema:
                type: object
                properties:
                  module: { type: string, example: llm-gateway }
                  version: { type: string, example: 0.1.0 }
                  status: { type: string, example: ready }

  /providers:
    get:
      tags: [Providers]
      summary: List providers
      responses:
        "200":
          description: List of providers
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Provider" }
    post:
      tags: [Providers]
      summary: Create provider
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProviderCreate" }
      responses:
        "200":
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, example: true }
                  provider: { $ref: "#/components/schemas/Provider" }

  /providers/{id}:
    get:
      tags: [Providers]
      summary: Get provider by ID
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Provider
          content:
            application/json:
              schema:
                type: object
                properties:
                  provider: { $ref: "#/components/schemas/Provider" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [Providers]
      summary: Update provider
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProviderUpdate" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  provider: { $ref: "#/components/schemas/Provider" }
    delete:
      tags: [Providers]
      summary: Delete provider
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, example: true }

  /models:
    get:
      tags: [Models]
      summary: List models
      responses:
        "200":
          description: List
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Model" }
    post:
      tags: [Models]
      summary: Create model
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ModelCreate" }
      responses:
        "200":
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  model: { $ref: "#/components/schemas/Model" }

  /models/{id}:
    get:
      tags: [Models]
      summary: Get model by ID
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Model
          content:
            application/json:
              schema:
                type: object
                properties:
                  model: { $ref: "#/components/schemas/Model" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [Models]
      summary: Update model
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ModelUpdate" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  model: { $ref: "#/components/schemas/Model" }
    delete:
      tags: [Models]
      summary: Delete model
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, example: true }

  /models/by-key/{key}:
    get:
      tags: [Models]
      summary: Get model by key
      parameters:
        - in: path
          name: key
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Model
          content:
            application/json:
              schema:
                type: object
                properties:
                  model: { $ref: "#/components/schemas/Model" }
        "404": { $ref: "#/components/responses/NotFound" }

  /usage:
    get:
      tags: [Usage]
      summary: Recent usage entries
      parameters:
        - in: query
          name: limit
          schema: { type: integer, default: 200, minimum: 1, maximum: 2000 }
      responses:
        "200":
          description: Usage list
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/UsageEntry" }

  /tokens:
    post:
      tags: [Tokens]
      summary: Token counting utility
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TokensRequest" }
      responses:
        "200":
          description: Token counts
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TokensResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }

  /embeddings:
    post:
      tags: [Embeddings]
      summary: Create embeddings (OpenAI-compatible)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EmbeddingsRequest" }
      responses:
        "200":
          description: OpenAI-compatible embedding response
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OpenAIEmbeddingsResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "500": { $ref: "#/components/responses/InternalError" }

  /embeddings/batch:
    post:
      tags: [Embeddings]
      summary: Create embeddings (explicit batch)
      description: Input must be an array of strings. Internally forwards to /embeddings.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [input]
              properties:
                input:
                  type: array
                  items: { type: string }
      responses:
        "200":
          description: OpenAI-compatible embedding response
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OpenAIEmbeddingsResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }

  /v1/chat:
    post:
      tags: [Chat]
      summary: Canonical chat endpoint (streaming by default)
      description: |
        - Default stream=true, SSE returned as text/event-stream.
        - Set stream=false for a single JSON response.
        - Dry-run: add ?dry_run=1 or body.dry_run=true to validate and estimate cost without an LLM call.

        SSE event payloads:
        - data: {"type":"delta","content":"..."}
        - data: {"type":"done"}
        - data: {"type":"error","message":"..."}
      parameters:
        - in: query
          name: dry_run
          schema: { type: string, enum: ["1"] }
          description: Enable dry-run via query parameter.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChatRequest" }
      responses:
        "200":
          description: |
            When stream=true (default) returns text/event-stream with SSE messages.  
            When stream=false returns JSON with content or provider response.
          content:
            text/event-stream:
              schema:
                type: string
                example: |
                  data: {"type":"delta","content":"Hello"}
                  
                  data: {"type":"done"}
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ChatNonStreamResponse"
                  - $ref: "#/components/schemas/ChatDryRunResponse"
        "400": { $ref: "#/components/responses/BadRequest" }
        "500": { $ref: "#/components/responses/InternalError" }

  /compat/llm-chat:
    post:
      tags: [Chat]
      summary: Compatibility chat endpoint
      description: Same behavior as /v1/chat with a relaxed request body for legacy clients.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChatRequest" }
      responses:
        "200":
          description: Stream or JSON as in /v1/chat
          content:
            text/event-stream:
              schema: { type: string }
            application/json:
              schema: { $ref: "#/components/schemas/ChatNonStreamResponse" }

  /compat/llm-workflows:
    post:
      tags: [Chat]
      summary: Workflows-friendly streaming endpoint
      description: |
        SSE remaps payload types:
        - data: {"type":"llm.delta","data":"...","rid":"..."}
        - data: {"type":"done","rid":"..."}
        - data: {"type":"error","message":"...","rid":"..."}
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChatRequest" }
      responses:
        "200":
          description: Stream or JSON as in /v1/chat
          content:
            text/event-stream:
              schema: { type: string }
            application/json:
              schema: { $ref: "#/components/schemas/ChatNonStreamResponse" }

  /telemetry/recent:
    get:
      tags: [Telemetry]
      summary: List recent finished interactions
      parameters:
        - in: query
          name: limit
          schema: { type: integer, default: 20, minimum: 1, maximum: 200 }
      responses:
        "200":
          description: Recent interactions
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/TelemetryRecord" }

  /telemetry/ongoing:
    get:
      tags: [Telemetry]
      summary: List ongoing interactions
      responses:
        "200":
          description: Ongoing interactions
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/TelemetryRecord" }

  /telemetry/live:
    get:
      tags: [Telemetry]
      summary: Subscribe to live telemetry (SSE)
      description: First event is a snapshot with {type:"snapshot", live:[], recent:[]}.
      responses:
        "200":
          description: text/event-stream
          content:
            text/event-stream:
              schema:
                type: string
                example: |
                  data: {"type":"snapshot","live":[],"recent":[]}
                  
                  data: {"type":"started","data":{"id":"...","model":"..."}}

  /conversations:
    get:
      tags: [Conversations]
      summary: List conversations
      parameters:
        - in: query
          name: limit
          schema: { type: integer, default: 50, minimum: 1, maximum: 200 }
        - in: query
          name: archived
          schema: { type: boolean, default: false }
        - in: query
          name: search
          schema: { type: string }
      responses:
        "200":
          description: Conversations
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/ConversationListItem" }
    post:
      tags: [Conversations]
      summary: Create conversation
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ConversationCreate" }
      responses:
        "200":
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  conversation: { $ref: "#/components/schemas/Conversation" }

  /conversations/{id}:
    get:
      tags: [Conversations]
      summary: Get conversation
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Conversation
          content:
            application/json:
              schema:
                type: object
                properties:
                  conversation: { $ref: "#/components/schemas/Conversation" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [Conversations]
      summary: Update conversation metadata
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ConversationUpdate" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  conversation: { $ref: "#/components/schemas/Conversation" }
    delete:
      tags: [Conversations]
      summary: Delete conversation (and messages)
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, example: true }

  /conversations/{id}/messages:
    get:
      tags: [Conversations]
      summary: List messages (paginated)
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
        - in: query
          name: limit
          schema: { type: integer, default: 100, minimum: 1, maximum: 500 }
        - in: query
          name: before
          schema: { type: integer, description: "Return messages with id < before" }
      responses:
        "200":
          description: Messages
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/ConversationMessage" }
    post:
      tags: [Conversations]
      summary: Add message to conversation
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ConversationMessageCreate" }
      responses:
        "200":
          description: Added
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  message: { $ref: "#/components/schemas/ConversationMessage" }

  /conversations/{id}/truncate:
    post:
      tags: [Conversations]
      summary: Truncate oldest messages to fit a max token budget
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [max_tokens]
              properties:
                max_tokens: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Truncation result
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  deleted_messages: { type: integer }
                  message: { type: string }

  /conversations/{id}/export:
    get:
      tags: [Conversations]
      summary: Export conversation with all messages
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Export payload
          content:
            application/json:
              schema:
                type: object
                properties:
                  conversation: { $ref: "#/components/schemas/Conversation" }
                  messages:
                    type: array
                    items: { $ref: "#/components/schemas/ConversationMessage" }
                  exported_at: { type: string, format: date-time }

  /templates:
    get:
      tags: [Templates]
      summary: List templates
      parameters:
        - in: query
          name: archived
          schema: { type: boolean, default: false }
        - in: query
          name: tags
          schema:
            type: string
            description: "Comma-separated list of tags"
      responses:
        "200":
          description: Templates
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Template" }
    post:
      tags: [Templates]
      summary: Create template (auto-increments version)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TemplateCreate" }
      responses:
        "200":
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  template: { $ref: "#/components/schemas/Template" }

  /templates/{id}:
    get:
      tags: [Templates]
      summary: Get template by ID
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Template
          content:
            application/json:
              schema:
                type: object
                properties:
                  template: { $ref: "#/components/schemas/Template" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [Templates]
      summary: Update template
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TemplateUpdate" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  template: { $ref: "#/components/schemas/Template" }
    delete:
      tags: [Templates]
      summary: Delete template
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, example: true }

  /templates/by-name/{name}:
    get:
      tags: [Templates]
      summary: Get template by name (latest or specific version)
      parameters:
        - in: path
          name: name
          required: true
          schema: { type: string }
        - in: query
          name: version
          schema: { type: integer }
      responses:
        "200":
          description: Template
          content:
            application/json:
              schema:
                type: object
                properties:
                  template: { $ref: "#/components/schemas/Template" }
        "404": { $ref: "#/components/responses/NotFound" }

  /templates/{id}/render:
    post:
      tags: [Templates]
      summary: Render template by ID
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [variables]
              properties:
                variables:
                  type: object
                  additionalProperties: true
      responses:
        "200":
          description: Rendered output
          content:
            application/json:
              schema:
                type: object
                properties:
                  template: { $ref: "#/components/schemas/Template" }
                  rendered: { type: string }
                  variables_used:
                    type: object
                    additionalProperties: true

  /templates/by-name/{name}/render:
    post:
      tags: [Templates]
      summary: Render template by name (latest or specific version)
      parameters:
        - in: path
          name: name
          required: true
          schema: { type: string }
        - in: query
          name: version
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [variables]
              properties:
                variables:
                  type: object
                  additionalProperties: true
      responses:
        "200":
          description: Rendered output
          content:
            application/json:
              schema:
                type: object
                properties:
                  template: { $ref: "#/components/schemas/Template" }
                  rendered: { type: string }
                  variables_used:
                    type: object
                    additionalProperties: true

  /debug/replay/{usage_id}:
    post:
      tags: [Debug]
      summary: Replay a request from a usage record (non-stream)
      parameters:
        - in: path
          name: usage_id
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Replay result
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  replayed: { type: boolean }
                  original_usage_id: { type: integer }
                  original_cost: { type: number }
                  response: { type: string }
                  note: { type: string }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

  /debug/dry-run:
    post:
      tags: [Debug]
      summary: Dry-run validation and cost estimate (by model ID)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                model_id: { type: integer, description: "Preferred field" }
                model: { type: integer, description: "Also accepted alias" }
                messages:
                  type: array
                  items: { $ref: "#/components/schemas/ChatMessage" }
                temperature: { type: number }
                max_tokens: { type: integer }
      responses:
        "200":
          description: Dry-run result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChatDryRunResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }

  /debug/validate:
    post:
      tags: [Debug]
      summary: Validate a chat-like request without processing
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "200":
          description: Validation outcome
          content:
            application/json:
              schema:
                type: object
                properties:
                  valid: { type: boolean }
                  errors:
                    type: array
                    items: { type: string }
                  warnings:
                    type: array
                    items: { type: string }
                  structure:
                    type: object
                    properties:
                      has_model: { type: boolean }
                      has_messages: { type: boolean }
                      message_count: { type: integer }
                      has_temperature: { type: boolean }
                      has_max_tokens: { type: boolean }
                      stream: { type: boolean }

  /debug/test-provider/{id}:
    get:
      tags: [Debug]
      summary: Test connectivity for a provider base URL
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Connectivity result
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  provider:
                    type: object
                    properties:
                      id: { type: integer }
                      name: { type: string }
                      kind: { type: string }
                  test_url: { type: string }
                  reachable: { type: boolean }
                  status: { type: integer }
                  message: { type: string }

  /logging:
    get:
      tags: [Logging]
      summary: Get effective logging configuration (redacted)
      security:
        - internalAuth: []
      responses:
        "200":
          description: Effective logging config
          content:
            application/json:
              schema:
                type: object
                properties:
                  effective:
                    type: object
                    additionalProperties: true
                  redacted: { type: boolean }
        "401": { $ref: "#/components/responses/Unauthorized" }
    put:
      tags: [Logging]
      summary: Update logging configuration
      security:
        - internalAuth: []
      parameters:
        - in: query
          name: dry_run
          schema: { type: string, enum: ["1"] }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "200":
          description: Applied or validated
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  dry_run: { type: boolean }
                  result:
                    type: object
                    additionalProperties: true
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /logging/test:
    post:
      tags: [Logging]
      summary: Send a test log record to sink
      security:
        - internalAuth: []
      responses:
        "200":
          description: Sink test result
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  result:
                    type: object
                    additionalProperties: true
        "401": { $ref: "#/components/responses/Unauthorized" }

  /logging/reload:
    post:
      tags: [Logging]
      summary: Reload logging config from environment
      security:
        - internalAuth: []
      responses:
        "200":
          description: Reload result
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  result:
                    type: object
                    additionalProperties: true
        "401": { $ref: "#/components/responses/Unauthorized" }

  /logs:
    get:
      tags: [Logs]
      summary: Get in-memory log buffer (recent N)
      parameters:
        - in: query
          name: limit
          schema: { type: integer, default: 200, minimum: 1, maximum: 2000 }
      responses:
        "200":
          description: Log entries
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/LogEntry" }

  /logs/clear:
    post:
      tags: [Logs]
      summary: Clear in-memory log buffer
      responses:
        "200":
          description: Cleared
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, example: true }

components:
  securitySchemes:
    internalAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Optional internal bearer auth for logging config endpoints.  
        Set env INTERNAL_API_TOKEN in the service; send `Authorization: Bearer <token>`.

  responses:
    NotFound:
      description: Not found
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    InternalError:
      description: Internal error
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    Error:
      type: object
      properties:
        error: { type: string }
        rid: { type: string }
        details:
          type: object
          additionalProperties: true
        hint: { type: string }

    Provider:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        kind:
          type: string
          enum: [openai, openai-compatible, ollama]
        base_url: { type: string }
        api_key:
          type: string
          description: May be redacted in responses
          nullable: true
        headers:
          type: object
          additionalProperties: true
          nullable: true
        created_at: { type: string, format: date-time, nullable: true }

    ProviderCreate:
      type: object
      required: [name, kind, base_url]
      properties:
        name: { type: string }
        kind:
          type: string
          enum: [openai, openai-compatible, ollama]
        base_url: { type: string }
        api_key: { type: string, nullable: true }
        headers:
          type: object
          additionalProperties: true
          nullable: true

    ProviderUpdate:
      allOf:
        - $ref: "#/components/schemas/ProviderCreate"

    Model:
      type: object
      properties:
        id: { type: integer }
        provider_id: { type: integer }
        key: { type: string, nullable: true }
        model_name: { type: string }
        display_name: { type: string, nullable: true }
        mode:
          type: string
          enum: [auto, chat, responses]
        supports_responses: { type: boolean }
        supports_reasoning: { type: boolean }
        input_cost_per_million: { type: number }
        output_cost_per_million: { type: number }
        currency: { type: string }
        created_at: { type: string, format: date-time, nullable: true }
        provider_name: { type: string, nullable: true }
        provider_kind:
          type: string
          enum: [openai, openai-compatible, ollama]
          nullable: true
        provider_base_url: { type: string, nullable: true }

    ModelCreate:
      type: object
      required: [provider_id, model_name]
      properties:
        provider_id: { type: integer }
        model_name: { type: string }
        key: { type: string, nullable: true }
        display_name: { type: string, nullable: true }
        mode:
          type: string
          enum: [auto, chat, responses]
          default: auto
        supports_responses: { type: boolean, default: false }
        supports_reasoning: { type: boolean, default: false }
        input_cost_per_million: { type: number, default: 0 }
        output_cost_per_million: { type: number, default: 0 }
        currency: { type: string, default: USD }

    ModelUpdate:
      allOf:
        - $ref: "#/components/schemas/ModelCreate"

    UsageEntry:
      type: object
      properties:
        id: { type: integer }
        ts: { type: string, format: date-time }
        provider_id: { type: integer, nullable: true }
        model_id: { type: integer, nullable: true }
        conversation_id: { type: string, nullable: true }
        input_tokens: { type: integer, nullable: true }
        output_tokens: { type: integer, nullable: true }
        prompt_chars: { type: integer, nullable: true }
        completion_chars: { type: integer, nullable: true }
        cost: { type: number, nullable: true }
        meta:
          type: object
          additionalProperties: true
          nullable: true

    TokensRequest:
      type: object
      properties:
        model: { type: string, nullable: true }
        encoding:
          type: string
          enum: [cl100k_base, o200k_base]
          nullable: true
        text: { type: string, nullable: true }
        messages:
          type: array
          items: { $ref: "#/components/schemas/ChatMessage" }
          nullable: true

    TokensResponse:
      type: object
      properties:
        model: { type: string, nullable: true }
        encoding: { type: string }
        text_tokens: { type: integer, nullable: true }
        message_tokens: { type: integer, nullable: true }
        total_tokens: { type: integer }
        note: { type: string }

    EmbeddingsRequest:
      type: object
      required: [input]
      properties:
        input:
          oneOf:
            - type: string
            - type: array
              items: { type: string }
        model: { type: string, nullable: true, description: "Override upstream model name. Default text-embedding-3-small." }
        model_id: { type: integer, nullable: true }
        model_key: { type: string, nullable: true }
        encoding_format:
          type: string
          enum: [float, base64]
          default: float
        dimensions: { type: integer, nullable: true }
        metadata:
          type: object
          additionalProperties: true
          nullable: true
        conversation_id: { type: string, nullable: true }

    OpenAIEmbeddingsResponse:
      type: object
      properties:
        object: { type: string, example: list }
        data:
          type: array
          items:
            type: object
            properties:
              object: { type: string, example: embedding }
              index: { type: integer }
              embedding:
                oneOf:
                  - type: array
                    items: { type: number }
                  - type: string
        model: { type: string }
        usage:
          type: object
          properties:
            prompt_tokens: { type: integer }
            total_tokens: { type: integer }

    ChatMessage:
      type: object
      required: [role]
      properties:
        role:
          type: string
          enum: [system, user, assistant, tool]
        content:
          description: Text content; if array used, only text parts are counted for tokens.
          oneOf:
            - type: string
            - type: array
              items:
                type: object
                additionalProperties: true
        name: { type: string, nullable: true }

    ChatRequest:
      type: object
      properties:
        # model resolution
        modelId: { type: integer, nullable: true }
        modelKey: { type: string, nullable: true }
        model: { type: string, nullable: true, description: "Upstream model name; gateway resolves to a configured model" }

        # prompt
        messages:
          type: array
          items: { $ref: "#/components/schemas/ChatMessage" }

        # generation params
        temperature: { type: number, nullable: true }
        max_tokens: { type: integer, nullable: true }
        stream: { type: boolean, default: true }

        # advanced
        useResponses: { type: boolean, nullable: true, description: "Force OpenAI Responses API path if true" }
        reasoning: { type: boolean, nullable: true }
        metadata:
          type: object
          additionalProperties: true
          nullable: true
        conversation_id: { type: string, nullable: true }

        # templates
        template_id: { type: integer, nullable: true }
        template_name: { type: string, nullable: true }
        template_variables:
          type: object
          additionalProperties: true
          nullable: true
        replace_last_message: { type: boolean, nullable: true }

        # tooling
        dry_run: { type: boolean, nullable: true }

    ChatNonStreamResponse:
      type: object
      properties:
        content:
          type: string
          description: Assistant text for non-stream chat/completions.  
            If the Responses API path was used and raw provider payload is returned, content may be absent there.
        # When Responses API is used non-stream, gateway may return the provider JSON; callers should be ready to handle it.

    ChatDryRunResponse:
      type: object
      properties:
        ok: { type: boolean, example: true }
        dry_run: { type: boolean, example: true }
        model:
          type: object
          properties:
            id: { type: integer }
            name: { type: string }
            display_name: { type: string, nullable: true }
        token_estimate:
          type: object
          properties:
            input_tokens: { type: integer }
            estimated_output_tokens: { type: integer }
        cost_estimate:
          type: object
          properties:
            total_cost: { type: number, nullable: true }
            currency: { type: string, example: USD }
        template_used: { type: string, nullable: true }
        message_count: { type: integer }
        note: { type: string }

    TelemetryRecord:
      type: object
      properties:
        id: { type: string }
        model: { type: string, nullable: true }
        provider: { type: string, nullable: true }
        stream: { type: boolean }
        ip: { type: string, nullable: true }
        started_at: { type: string, format: date-time, nullable: true }
        finished_at: { type: string, format: date-time, nullable: true }
        meta:
          type: object
          additionalProperties: true
          nullable: true
        state:
          type: string
          enum: [running, done, error]
        output: { type: string, nullable: true }
        inTok: { type: integer, nullable: true }
        outTok: { type: integer, nullable: true }
        cost: { type: number, nullable: true }

    ConversationListItem:
      type: object
      properties:
        id: { type: string }
        title: { type: string, nullable: true }
        created_at: { type: string, format: date-time, nullable: true }
        updated_at: { type: string, format: date-time, nullable: true }
        system_prompt: { type: string, nullable: true }
        model_id: { type: integer, nullable: true }
        model_name: { type: string, nullable: true }
        meta:
          type: object
          additionalProperties: true
          nullable: true
        archived: { type: boolean }
        message_count: { type: integer }
        last_message_at: { type: string, format: date-time, nullable: true }

    Conversation:
      type: object
      properties:
        id: { type: string }
        title: { type: string, nullable: true }
        created_at: { type: string, format: date-time, nullable: true }
        updated_at: { type: string, format: date-time, nullable: true }
        system_prompt: { type: string, nullable: true }
        model_id: { type: integer, nullable: true }
        model_name: { type: string, nullable: true }
        meta:
          type: object
          additionalProperties: true
          nullable: true
        archived: { type: boolean }

    ConversationCreate:
      type: object
      required: [id]
      properties:
        id: { type: string }
        title: { type: string, nullable: true }
        system_prompt: { type: string, nullable: true }
        model_id: { type: integer, nullable: true }
        meta:
          type: object
          additionalProperties: true
          nullable: true

    ConversationUpdate:
      type: object
      properties:
        title: { type: string, nullable: true }
        system_prompt: { type: string, nullable: true }
        model_id: { type: integer, nullable: true }
        meta:
          type: object
          additionalProperties: true
          nullable: true
        archived: { type: boolean, nullable: true }

    ConversationMessage:
      type: object
      properties:
        id: { type: integer }
        conversation_id: { type: string }
        role:
          type: string
          enum: [system, user, assistant, tool]
        content: { type: string, nullable: true }
        tokens: { type: integer, nullable: true }
        cost: { type: number, nullable: true }
        created_at: { type: string, format: date-time }
        meta:
          type: object
          additionalProperties: true
          nullable: true

    ConversationMessageCreate:
      type: object
      required: [role]
      properties:
        role:
          type: string
          enum: [system, user, assistant, tool]
        content: { type: string, nullable: true }
        tokens: { type: integer, nullable: true }
        cost: { type: number, nullable: true }
        meta:
          type: object
          additionalProperties: true
          nullable: true

    Template:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        version: { type: integer }
        template: { type: string }
        variables:
          type: object
          additionalProperties: true
          nullable: true
        description: { type: string, nullable: true }
        tags:
          type: array
          items: { type: string }
          nullable: true
        usage_count: { type: integer, nullable: true }
        avg_tokens: { type: integer, nullable: true }
        avg_cost: { type: number, nullable: true }
        created_at: { type: string, format: date-time, nullable: true }
        updated_at: { type: string, format: date-time, nullable: true }
        archived: { type: boolean }

    TemplateCreate:
      type: object
      required: [name, template]
      properties:
        name: { type: string }
        template: { type: string }
        description: { type: string, nullable: true }
        variables:
          type: object
          additionalProperties: true
          nullable: true
        tags:
          type: array
          items: { type: string }
          nullable: true

    TemplateUpdate:
      type: object
      properties:
        template: { type: string, nullable: true }
        description: { type: string, nullable: true }
        variables:
          type: object
          additionalProperties: true
          nullable: true
        tags:
          type: array
          items: { type: string }
          nullable: true
        archived: { type: boolean, nullable: true }

    LogEntry:
      type: object
      properties:
        ts: { type: string, format: date-time }
        level:
          type: string
          enum: [debug, info, warn, error]
        msg: { type: string }
        meta:
          type: object
          additionalProperties: true
          nullable: true

externalDocs:
  description: Admin UI
  url: /api/v1/gateway/admin

x-nginx-notes: |
  Through edge-nginx, use these base URLs:
  - JSON API: https://<edge-host>:8443/api/v1/gateway/api
    Examples:
      GET  /api/v1/gateway/api/models
      POST /api/v1/gateway/api/v1/chat   (SSE by default)
      POST /api/v1/gateway/api/v1/chat?dry_run=1  (dry-run)
      GET  /api/v1/gateway/api/telemetry/live     (SSE)
      POST /api/v1/gateway/api/embeddings
  - Module base (UI/health):
      GET  /api/v1/gateway/health
      GET  /api/v1/gateway/admin

  NGINX rewrites /api/v1/gateway/api/<path> → llm-gateway:/api/<path> and proxies others under /api/v1/gateway/ to the app root.