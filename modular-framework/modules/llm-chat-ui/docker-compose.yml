version: '3.8'

services:
  postgres:
    image: postgres:14-alpine
    container_name: postgres-llm-chat-ui
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=llm_chat_ui
    ports:
      - "5433:5432"  # Different port to avoid conflict with llm-gateway postgres
    volumes:
      - ./pgdata:/var/lib/postgresql/data
    networks:
      - app-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: llm-chat-ui-backend
    environment:
      - NODE_ENV=production
      - PORT=3020
      - PGHOST=postgres
      - PGPORT=5432
      - PGUSER=postgres
      - PGPASSWORD=postgres
      - PGDATABASE=llm_chat_ui
      - LLM_GATEWAY_URL=http://llm-gateway:3010
    expose:
      - "3020"
    ports:
      - "3020:3020"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3020/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  frontend:
    build: ./frontend
    container_name: llm-chat-ui-frontend
    environment:
      - REACT_APP_API_URL=http://localhost:3020
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - app-network
    restart: unless-stopped

networks:
  app-network:
    external: true  # Use existing network from llm-gateway

volumes:
  pgdata:
