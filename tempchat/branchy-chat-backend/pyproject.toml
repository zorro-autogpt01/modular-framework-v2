[project]
name = "branchy-chat-backend"
version = "0.1.0"
description = "Branchable chat API that integrates with an external LLM Gateway"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.114",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.2",
  "alembic>=1.13",
  "httpx>=0.27",
  "python-dotenv>=1.0",
  "orjson>=3.9",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "httpx[http2]>=0.27",
]

[tool.alembic]
script_location = "app/db/migrations"

[tool.pytest.ini_options]
pythonpath = ["."]