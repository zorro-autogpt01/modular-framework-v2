version: "3.9"
services:
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
    env_file: .env
    depends_on:
      - db
      - redis
    ports:
      - "8000:8000"

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: branchy
      POSTGRES_PASSWORD: branchy
      POSTGRES_DB: branchy
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "no"]
    volumes:
      - redisdata:/data

volumes:
  pgdata: {}
  redisdata: {}